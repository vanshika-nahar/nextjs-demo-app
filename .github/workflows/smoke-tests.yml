name: Smoke Tests

# Runs for ANY pull request into stage: dev -> stage, and branches created from stage -> stage

on:
  pull_request:
    branches:
      - stage
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger-automation:
    name: Trigger smoke tests
    runs-on: ubuntu-latest

    steps:
      # Replaces the curl call: this action fails the job if the dispatch is rejected
      # (bad token, wrong repo name), whereas curl without --fail always "passes".
      - name: Trigger automation repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          repository: vanshika-nahar/nextjs-demo-automation
          event-type: run-smoke-tests
          client-payload: |
            {
              "app_repo":  ${{ toJSON(github.repository) }},
              "sha":       ${{ toJSON(github.event.pull_request.head.sha) }},
              "head_ref":  ${{ toJSON(github.event.pull_request.head.ref) }},
              "base_ref":  ${{ toJSON(github.event.pull_request.base.ref) }},
              "pr_number": ${{ github.event.pull_request.number }}
            }'