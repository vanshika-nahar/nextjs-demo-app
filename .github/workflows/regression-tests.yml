name: Regression Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    name: Run Regression Tests
    runs-on: ubuntu-latest
 
    steps:
      - name: Trigger automation repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AUTOMATION_REPO_TOKEN }}
          repository: vanshika-nahar/nextjs-demo-automation
          event-type: run-regression-tests
          client-payload: |
            {
              "app_repo":  ${{ toJSON(github.repository) }},
              "sha":       ${{ toJSON(github.event.pull_request.head.sha) }},
              "head_ref":  ${{ toJSON(github.event.pull_request.head.ref) }},
              "base_ref":  ${{ toJSON(github.event.pull_request.base.ref) }},
              "pr_number": ${{ github.event.pull_request.number }}
            }